<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendrier BMEO – V5 AUDITÉ</title>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script>

  <style>
    :root {
      --border:#e7eaf0;
      --muted:#667085;
      --text:#202939;
      --bg:#f8fafc;
      --soft:#f4f6f9;
      --card:#ffffff;
      --accent:#334155;
      --shadow:0 12px 32px rgba(15,23,42,.14);
      --soft-shadow:0 3px 12px rgba(15,23,42,.07);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    #app { height: 100vh; display: flex; flex-direction: column; }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,.96);
      box-shadow: 0 1px 0 rgba(15,23,42,.03);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .toolbar .spacer { flex: 1; }

    select, input, textarea, button {
      font: inherit;
    }

    select, input, textarea {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 11px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(15,23,42,.03);
      color: var(--text);
    }

    select { min-width: 170px; }

    button {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 13px;
      background: #fff;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
      cursor: pointer;
    }

    button:hover { transform: translateY(-1px); box-shadow: var(--soft-shadow); }

    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    #calendarWrap { flex: 1; min-height: 0; padding: 14px; }
    #calendar {
      height: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px;
      box-shadow: var(--soft-shadow);
      overflow: hidden;
    }

    .fc .fc-toolbar { gap: 10px; }
    .fc .fc-toolbar-title { font-size: 1.12rem; font-weight: 750; letter-spacing:-.01em; }
    .fc .fc-button {
      text-transform: none;
      border-radius: 9px !important;
      box-shadow: none !important;
    }
    .fc .fc-button-primary {
      background: #334155;
      border-color: #334155;
    }
    .fc .fc-button-primary:not(:disabled):hover { background:#1f2937; border-color:#1f2937; }
    .fc .fc-button-primary:not(:disabled).fc-button-active { background:#111827; border-color:#111827; }

    .fc-theme-standard td,
    .fc-theme-standard th { border-color:#edf0f4; }

    .fc .fc-col-header-cell-cushion {
      padding: 8px 4px;
      color:#475467;
      font-weight:700;
      text-decoration:none;
    }

    .fc .fc-daygrid-day-number {
      color:#475467;
      text-decoration:none;
      padding:7px;
      font-weight:600;
    }

    .fc .fc-day-today { background:#fffaf0 !important; }

    .fc-event {
      border: 0 !important;
      border-radius: 7px !important;
      box-shadow: 0 1px 2px rgba(15,23,42,.08);
      transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
      overflow: visible !important;
    }

    .fc-event:hover {
      transform: scale(1.045);
      z-index: 30 !important;
      box-shadow: 0 7px 18px rgba(15,23,42,.18);
      filter: saturate(1.02);
    }

    .event-compact {
      font-size: 10.5px;
      line-height: 1.22;
      padding: 4px 6px;
      overflow: hidden;
      min-height: 34px;
      color:#253047;
    }

    .event-main {
      font-weight: 750;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .event-description {
      margin-top: 3px;
      font-size: 11.5px;
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity:.9;
    }

    .tooltip {
      position: fixed;
      display: none;
      max-width: 340px;
      z-index: 9999;
      background: #ffffff;
      color: #1f2937;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: var(--shadow);
      pointer-events: none;
      font-size: 12px;
      line-height: 1.35;
    }

    .tooltip b { display:block; margin-bottom: 4px; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(17,24,39,.35);
      z-index: 10000;
      padding: 18px;
    }

    .modal {
      width: min(620px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .modal h2 { margin: 0 0 14px; font-size: 18px; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { display:flex; flex-direction:column; gap:6px; }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size:12px; color:var(--muted); font-weight:600; }
    textarea { min-height: 92px; resize: vertical; }

    .actions {
      margin-top: 16px;
      display:flex;
      justify-content:flex-end;
      gap:8px;
    }

    .detail-row {
      display:grid;
      grid-template-columns: 145px 1fr;
      gap:10px;
      padding:8px 0;
      border-bottom:1px solid #eef0f3;
    }

    .detail-row:last-child { border-bottom:0; }
    .detail-label { color:var(--muted); font-size:12px; font-weight:600; }
    .detail-value { white-space:pre-wrap; }

    .notice {
      padding: 8px 12px;
      font-size: 12px;
      color: #7a4a00;
      background: #fff6df;
      border-bottom: 1px solid #ffe0a3;
      display:none;
    }


    .multi-options {
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      padding:8px;
      border:1px solid var(--border);
      border-radius:10px;
      background:#fff;
    }

    .person-chip {
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:7px 9px;
      border:1px solid #e4e7ec;
      border-radius:999px;
      background:#f9fafb;
      font-size:12px;
      cursor:pointer;
      user-select:none;
    }

    .person-chip input {
      margin:0;
      width:auto;
      box-shadow:none;
    }

    .edit-note {
      font-size:11px;
      color:var(--muted);
      margin-top:4px;
    }

    .modal select {
      width:100%;
      min-width:0;
    }

    .modal input[type="checkbox"] {
      width:auto;
      box-shadow:none;
    }

    @media (max-width: 700px) {
      .grid { grid-template-columns:1fr; }
      .field.full { grid-column:auto; }
      .detail-row { grid-template-columns:1fr; gap:3px; }
      select { min-width:140px; flex:1; }
    }
  </style>
</head>

<body>
<div id="app">
  <div id="notice" class="notice"></div>

  <div class="toolbar">
    <select id="filterService">
      <option value="">Tous les services</option>
    </select>

    <select id="filterAssignee">
      <option value="">Tous les assignés</option>
    </select>

    <button id="clearFilters">Réinitialiser les filtres</button>
    <div class="spacer"></div>
    <button id="createBtn" class="primary">+ Nouvelle action</button>
  </div>

  <div id="calendarWrap">
    <div id="calendar"></div>
  </div>
</div>

<div id="tooltip" class="tooltip"></div>

<div id="detailBackdrop" class="modal-backdrop">
  <div class="modal">
    <h2>Détail de l’événement</h2>

    <div class="grid">
      <div class="field">
        <label>Service</label>
        <select id="editService"></select>
      </div>

      <div class="field">
        <label>Assigné</label>
        <div id="editAssigneeOptions" class="multi-options"></div>
      </div>

      <div class="field">
        <label>Domaine</label>
        <select id="editDomain"></select>
      </div>

      <div class="field">
        <label>Statut</label>
        <select id="editStatus"></select>
      </div>

      <div class="field">
        <label>Date de début</label>
        <input id="editStart" type="date" />
      </div>

      <div class="field">
        <label>Date d’échéance</label>
        <input id="editEnd" type="date" />
      </div>

      <div class="field full">
        <label>Description</label>
        <textarea id="editDescription"></textarea>
      </div>

      <div class="field full">
        <label>Commentaire</label>
        <textarea id="editComment"></textarea>
      </div>

      <div class="field full">
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#344054">
          <input id="editEvent" type="checkbox" />
          Afficher cette action dans le calendrier
        </label>
        <div class="edit-note">Les modifications sont enregistrées directement dans « Toutes les actions BMEO ».</div>
      </div>
    </div>

    <div class="actions">
      <button id="closeDetail">Annuler</button>
      <button id="saveDetail" class="primary">Enregistrer dans Grist</button>
    </div>
  </div>
</div>

<div id="createBackdrop" class="modal-backdrop">
  <div class="modal">
    <h2>Créer une action</h2>
    <div class="grid">
      <div class="field">
        <label>Service</label>
        <select id="newService"></select>
      </div>

      <div class="field">
        <label>Assigné</label>
        <div id="newAssigneeOptions" class="multi-options"></div>
      </div>

      <div class="field">
        <label>Domaine</label>
        <select id="newDomain"></select>
      </div>

      <div class="field">
        <label>Statut (optionnel)</label>
        <select id="newStatus"></select>
      </div>

      <div class="field">
        <label>Date de début</label>
        <input id="newStart" type="date" />
      </div>

      <div class="field">
        <label>Date d’échéance</label>
        <input id="newEnd" type="date" />
      </div>

      <div class="field full">
        <label>Description</label>
        <textarea id="newDescription"></textarea>
      </div>

      <div class="field full">
        <label>Commentaire (optionnel)</label>
        <textarea id="newComment"></textarea>
      </div>

      <div class="field full">
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#344054">
          <input id="newEvent" type="checkbox" checked style="width:auto" />
          Afficher cette action dans le calendrier
        </label>
      </div>
    </div>

    <div class="actions">
      <button id="cancelCreate">Annuler</button>
      <button id="saveCreate" class="primary">Créer dans Grist</button>
    </div>
  </div>
</div>

<script>
  const REQUIRED_COLUMNS = [
    {name:"Service", title:"Service", type:"Any"},
    {name:"Assigne", title:"Assigné", type:"Any"},
    {name:"Description", title:"Description", type:"Text"},
    {name:"DateDebut", title:"Date de début", type:"Date,DateTime"},
    {name:"DateEcheance", title:"Date d'échéance", type:"Date,DateTime"},
    {name:"Domaine", title:"Domaine", type:"Any"},
    {name:"Statut", title:"Statut", optional:true, type:"Any"},
    {name:"Commentaire", title:"Commentaire", optional:true, type:"Text"},
    {name:"Evenement", title:"Événement", type:"Bool"}
  ];

  let sourceRecords = [];
  let mappedRecords = [];
  let lastMappings = null;
  let calendar = null;
  let currentDetailRowId = null;

  // Référentiel des services (chargé depuis REF_service_utilisateur / variante proche).
  let serviceReferenceTableId = null;
  let referenceServices = []; // [{id, label}]

  const TEAM_ASSIGNEES = ["David", "Yvan", "Stéphane", "Franck", "Mohamed"];

  const $ = id => document.getElementById(id);

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function displayValue(v) {
    if (v == null) return "";
    if (Array.isArray(v)) {
      // Handles some Grist encoded/list-ish values gracefully.
      if (v.length && typeof v[0] === "string" && ["L","l"].includes(v[0])) {
        return v.slice(1).join(", ");
      }
      return v.join(", ");
    }
    if (typeof v === "object") {
      if (typeof v.toISOString === "function") return v.toISOString();
      return String(v);
    }
    return String(v);
  }

  function normalizeDate(value) {
    if (value == null || value === "") return null;

    // Grist Date/DateTime may arrive as numbers (seconds since epoch)
    if (typeof value === "number" && Number.isFinite(value)) {
      return new Date(value * 1000);
    }

    // moment-like object
    if (typeof value === "object") {
      if (typeof value.toDate === "function") return value.toDate();
      if (typeof value.valueOf === "function") {
        const n = value.valueOf();
        if (typeof n === "number" && Number.isFinite(n)) {
          const d = new Date(n);
          if (!Number.isNaN(d.getTime())) return d;
        }
      }
    }

    const d = new Date(value);
    return Number.isNaN(d.getTime()) ? null : d;
  }

  function ymd(date) {
    if (!date) return "";
    const y = date.getFullYear();
    const m = String(date.getMonth()+1).padStart(2,"0");
    const d = String(date.getDate()).padStart(2,"0");
    return `${y}-${m}-${d}`;
  }

  function formatDateFR(value) {
    const d = normalizeDate(value);
    if (!d) return "";
    return new Intl.DateTimeFormat("fr-FR", {
      day:"2-digit", month:"2-digit", year:"numeric"
    }).format(d);
  }

  const SERVICE_PASTELS = [
    {bg:"#DDEBFF", text:"#274060"},
    {bg:"#FCE1E4", text:"#6B3340"},
    {bg:"#E2F0D9", text:"#365B2C"},
    {bg:"#FFF0C9", text:"#6C5422"},
    {bg:"#E8DDF8", text:"#51416D"},
    {bg:"#D9F1F0", text:"#285C5A"},
    {bg:"#F7E0C7", text:"#694A2E"},
    {bg:"#E2E8F8", text:"#36466F"},
    {bg:"#F6DDF0", text:"#6A3D62"},
    {bg:"#E5F2D6", text:"#45612C"},
    {bg:"#DDEAF0", text:"#355765"},
    {bg:"#FDE6CF", text:"#735039"},
    {bg:"#EADFF5", text:"#5D4772"},
    {bg:"#D8F0E5", text:"#2D624C"},
    {bg:"#F5E7B8", text:"#6F5B22"},
    {bg:"#E1E4FA", text:"#454E78"}
  ];

  function servicePastel(text) {
    const s = displayValue(text) || "Sans service";
    let hash = 0;
    for (let i=0; i<s.length; i++) hash = s.charCodeAt(i) + ((hash << 5) - hash);
    return SERVICE_PASTELS[Math.abs(hash) % SERVICE_PASTELS.length];
  }

  function isTrue(value) {
    if (value === true || value === 1) return true;
    const s = String(value ?? "").trim().toLowerCase();
    return ["true","vrai","1","yes","oui"].includes(s);
  }


  function splitAssignees(value) {
    const text = displayValue(value);
    if (!text) return [];
    return text
      .split(/[,;|]/)
      .map(v => v.trim())
      .filter(Boolean);
  }

  function hasAssignee(value, person) {
    if (!person) return true;
    const target = person.trim().toLocaleLowerCase("fr");
    return splitAssignees(value).some(name => name.toLocaleLowerCase("fr") === target);
  }

  function uniqueValues(field) {
    return [...new Set(
      mappedRecords.map(r => displayValue(r[field]).trim()).filter(Boolean)
    )].sort((a,b) => a.localeCompare(b, "fr", {sensitivity:"base"}));
  }

  function fillSelect(id, values, selected="", emptyLabel="— Sélectionner —") {
    const el = $(id);
    el.innerHTML =
      `<option value="">${escapeHtml(emptyLabel)}</option>` +
      values.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
    if (selected && values.includes(selected)) el.value = selected;
    else if (selected) {
      el.insertAdjacentHTML("beforeend", `<option value="${escapeHtml(selected)}">${escapeHtml(selected)}</option>`);
      el.value = selected;
    }
  }

  function renderAssigneeChoices(containerId, selectedNames=[]) {
    const selected = new Set(selectedNames.map(v => v.toLocaleLowerCase("fr")));
    $(containerId).innerHTML = TEAM_ASSIGNEES.map(name => `
      <label class="person-chip">
        <input type="checkbox" value="${escapeHtml(name)}" ${selected.has(name.toLocaleLowerCase("fr")) ? "checked" : ""}>
        ${escapeHtml(name)}
      </label>
    `).join("");
  }

  function selectedAssignees(containerId) {
    return [...$(containerId).querySelectorAll('input[type="checkbox"]:checked')]
      .map(el => el.value);
  }


  function normalizeId(value) {
    return String(value ?? "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .replace(/[^a-z0-9]/g, "");
  }

  function findServiceTableId(tableIds) {
    const preferred = [
      "REF_service_utilisateur",
      "REF_Services_Utilisateurs",
      "REF_service_utilisateurs",
      "REF_Services_Utilisateur"
    ];
    for (const candidate of preferred) {
      const hit = tableIds.find(t => t === candidate);
      if (hit) return hit;
    }

    return tableIds.find(t => {
      const n = normalizeId(t);
      return n.includes("ref") && n.includes("service") && n.includes("utilisateur");
    }) || null;
  }

  function findServiceLabelColumn(rows) {
    const first = rows && rows[0];
    if (!first) return "Service";

    const keys = Object.keys(first).filter(k => k !== "id");
    const exact = keys.find(k => normalizeId(k) === "service");
    if (exact) return exact;

    const contains = keys.find(k => normalizeId(k).includes("service"));
    if (contains) return contains;

    // Fallback : première colonne métier disponible.
    return keys[0] || "Service";
  }

  async function loadReferenceServices() {
    try {
      const tableIds = await grist.docApi.listTables();
      serviceReferenceTableId = findServiceTableId(tableIds || []);

      if (!serviceReferenceTableId) {
        throw new Error("Table de référence des services introuvable");
      }

      const rows = await grist.docApi.fetchTable(serviceReferenceTableId);
      const labelColumn = findServiceLabelColumn(rows);

      referenceServices = (rows || [])
        .map(row => ({
          id: Number(row.id),
          label: displayValue(row[labelColumn]).trim()
        }))
        .filter(item => Number.isFinite(item.id) && item.label)
        .sort((a, b) => a.label.localeCompare(b.label, "fr", {sensitivity:"base"}));

      if (!referenceServices.length) {
        throw new Error(`Aucun service lisible dans ${serviceReferenceTableId}`);
      }

      return true;
    } catch (err) {
      console.error("Chargement du référentiel Service impossible :", err);

      // Fallback non bloquant : on garde les services déjà présents dans les actions.
      referenceServices = uniqueValues("Service").map((label, index) => ({
        id: null,
        label,
        fallback: true,
        fallbackIndex: index
      }));
      return false;
    }
  }

  function fillServiceSelect(id, selected="", emptyLabel="Choisir un service") {
    const el = $(id);
    const selectedText = displayValue(selected).trim();

    el.innerHTML =
      `<option value="">${escapeHtml(emptyLabel)}</option>` +
      referenceServices.map(item => {
        const value = item.id == null ? `label:${item.label}` : `ref:${item.id}`;
        return `<option value="${escapeHtml(value)}">${escapeHtml(item.label)}</option>`;
      }).join("");

    const match = referenceServices.find(item =>
      String(item.id) === String(selected) || item.label === selectedText
    );

    if (match) {
      el.value = match.id == null ? `label:${match.label}` : `ref:${match.id}`;
    }
  }

  function serviceWriteValue(selectId) {
    const value = $(selectId).value || "";
    if (value.startsWith("ref:")) {
      return Number(value.slice(4));
    }
    if (value.startsWith("label:")) {
      return value.slice(6);
    }
    return value;
  }

  function serviceLabelFromSelect(selectId) {
    const raw = $(selectId).value || "";
    if (raw.startsWith("ref:")) {
      const id = Number(raw.slice(4));
      return referenceServices.find(item => item.id === id)?.label || "";
    }
    if (raw.startsWith("label:")) return raw.slice(6);
    return raw;
  }

  function refreshFormLists() {
    const domains = uniqueValues("Domaine");
    const statuses = uniqueValues("Statut");

    // Creation form
    const newServiceCurrent = serviceLabelFromSelect("newService");
    const newDomainCurrent = $("newDomain")?.value || "";
    const newStatusCurrent = $("newStatus")?.value || "";
    fillServiceSelect("newService", newServiceCurrent, "Choisir un service");
    fillSelect("newDomain", domains, newDomainCurrent, "Choisir un domaine");
    fillSelect("newStatus", statuses, newStatusCurrent, "Choisir un statut");

    // Edit form
    const editServiceCurrent = serviceLabelFromSelect("editService");
    const editDomainCurrent = $("editDomain")?.value || "";
    const editStatusCurrent = $("editStatus")?.value || "";
    fillServiceSelect("editService", editServiceCurrent, "Choisir un service");
    fillSelect("editDomain", domains, editDomainCurrent, "Choisir un domaine");
    fillSelect("editStatus", statuses, editStatusCurrent, "Choisir un statut");
  }

  function recordToEvent(r) {
    const start = normalizeDate(r.DateDebut || r.DateEcheance);
    const endRaw = normalizeDate(r.DateEcheance || r.DateDebut);
    if (!start) return null;

    // FullCalendar all-day "end" is exclusive. Add one day to include échéance.
    let end = null;
    if (endRaw) {
      end = new Date(endRaw);
      end.setDate(end.getDate() + 1);
    }

    const service = displayValue(r.Service);
    const assignee = displayValue(r.Assigne);
    const description = displayValue(r.Description);
    const domain = displayValue(r.Domaine);

    const palette = servicePastel(service);

    return {
      id: String(r.id),
      title: `${assignee || "Non assigné"} · ${service || "Sans service"} · ${description || ""}`,
      start: ymd(start),
      end: end ? ymd(end) : undefined,
      allDay: true,
      backgroundColor: palette.bg,
      borderColor: palette.bg,
      textColor: palette.text,
      extendedProps: {
        rowId: r.id,
        service,
        assignee,
        description,
        domain,
        status: displayValue(r.Statut),
        comment: displayValue(r.Commentaire),
        dateStart: r.DateDebut,
        dateEnd: r.DateEcheance,
        raw: r
      }
    };
  }

  function filteredEvents() {
    const serviceFilter = $("filterService").value;
    const assigneeFilter = $("filterAssignee").value;

    return mappedRecords
      .filter(r => isTrue(r.Evenement))
      .filter(r => !serviceFilter || displayValue(r.Service) === serviceFilter)
      .filter(r => hasAssignee(r.Assigne, assigneeFilter))
      .map(recordToEvent)
      .filter(Boolean);
  }

  function rebuildFilters() {
    const currentService = $("filterService").value;
    const currentAssignee = $("filterAssignee").value;

    const services = referenceServices.length
      ? referenceServices.map(item => item.label)
      : uniqueValues("Service");

    $("filterService").innerHTML =
      `<option value="">Tous les services</option>` +
      services.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");

    $("filterAssignee").innerHTML =
      `<option value="">Tous les assignés</option>` +
      TEAM_ASSIGNEES.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");

    if (services.includes(currentService)) $("filterService").value = currentService;
    if (TEAM_ASSIGNEES.includes(currentAssignee)) $("filterAssignee").value = currentAssignee;

    refreshFormLists();
  }

  function refreshCalendar() {
    if (!calendar) return;
    calendar.removeAllEvents();
    calendar.addEventSource(filteredEvents());
  }

  function openDetail(event) {
    const p = event.extendedProps;
    currentDetailRowId = p.rowId;

    const domains = uniqueValues("Domaine");
    const statuses = uniqueValues("Statut");

    fillServiceSelect("editService", p.service, "Choisir un service");
    fillSelect("editDomain", domains, p.domain, "Choisir un domaine");
    fillSelect("editStatus", statuses, p.status, "Choisir un statut");
    renderAssigneeChoices("editAssigneeOptions", splitAssignees(p.assignee));

    $("editStart").value = ymd(normalizeDate(p.dateStart));
    $("editEnd").value = ymd(normalizeDate(p.dateEnd));
    $("editDescription").value = p.description || "";
    $("editComment").value = p.comment || "";

    const row = mappedRecords.find(r => String(r.id) === String(p.rowId));
    $("editEvent").checked = row ? isTrue(row.Evenement) : true;

    $("detailBackdrop").style.display = "flex";
    if (p.rowId) grist.setCursorPos({rowId:p.rowId});
  }

  async function saveDetail() {
    if (!currentDetailRowId) return;

    const assignees = selectedAssignees("editAssigneeOptions");
    const logicalRecord = {
      Service: serviceWriteValue("editService"),
      Assigne: assignees.join(", "),
      Domaine: $("editDomain").value,
      Statut: $("editStatus").value,
      DateDebut: $("editStart").value,
      DateEcheance: $("editEnd").value || $("editStart").value,
      Description: $("editDescription").value.trim(),
      Commentaire: $("editComment").value.trim(),
      Evenement: $("editEvent").checked
    };

    if (!logicalRecord.Service || !logicalRecord.DateDebut || !logicalRecord.Description) {
      alert("Service, date de début et description sont obligatoires.");
      return;
    }

    try {
      const mappedBack = grist.mapColumnNamesBack(logicalRecord, {mappings:lastMappings});
      // `id` is a reserved Grist record identifier, not a writable column.
      // Keep it only at the record level for updates, never inside `fields`.
      if (mappedBack && Object.prototype.hasOwnProperty.call(mappedBack, "id")) {
        delete mappedBack.id;
      }
      await grist.selectedTable.update(
        {id:Number(currentDetailRowId), fields:mappedBack},
        {parseStrings:true}
      );
      $("detailBackdrop").style.display = "none";
    } catch (err) {
      console.error(err);
      alert(
        "Modification impossible. Vérifie le niveau d’accès du widget et le mappage des colonnes.\n\n" +
        (err?.message || err)
      );
    }
  }

  function showTooltip(event, jsEvent) {
    const p = event.extendedProps;
    $("tooltip").innerHTML = `
      <b>${escapeHtml(p.assignee || "Non assigné")} · ${escapeHtml(p.service || "Sans service")}</b>
      <div style="margin-top:5px">${escapeHtml(p.description || "")}</div>
      <div style="margin-top:7px;font-size:11px;color:#667085">${escapeHtml(p.domain || "")}</div>
    `;
    $("tooltip").style.display = "block";
    moveTooltip(jsEvent);
  }

  function moveTooltip(jsEvent) {
    const tt = $("tooltip");
    let x = jsEvent.clientX + 14;
    let y = jsEvent.clientY + 14;
    const maxX = window.innerWidth - tt.offsetWidth - 10;
    const maxY = window.innerHeight - tt.offsetHeight - 10;
    x = Math.min(x, maxX);
    y = Math.min(y, maxY);
    tt.style.left = `${Math.max(10,x)}px`;
    tt.style.top = `${Math.max(10,y)}px`;
  }

  function closeTooltip() {
    $("tooltip").style.display = "none";
  }

  function openCreate(startDate=null, endDate=null) {
    refreshFormLists();

    const domains = uniqueValues("Domaine");
    const statuses = uniqueValues("Statut");

    fillServiceSelect("newService", $("filterService").value || "", "Choisir un service");
    fillSelect("newDomain", domains, "", "Choisir un domaine");
    fillSelect("newStatus", statuses, "", "Choisir un statut");
    renderAssigneeChoices(
      "newAssigneeOptions",
      $("filterAssignee").value ? [$("filterAssignee").value] : []
    );

    $("newDescription").value = "";
    $("newComment").value = "";
    $("newEvent").checked = true;

    if (startDate) $("newStart").value = ymd(startDate);
    else $("newStart").value = "";

    if (endDate) {
      const inclusiveEnd = new Date(endDate);
      inclusiveEnd.setDate(inclusiveEnd.getDate()-1);
      $("newEnd").value = ymd(inclusiveEnd);
    } else {
      $("newEnd").value = $("newStart").value;
    }

    $("createBackdrop").style.display = "flex";
  }

  async function createAction() {
    const logicalRecord = {
      Service: serviceWriteValue("newService"),
      Assigne: selectedAssignees("newAssigneeOptions").join(", "),
      Domaine: $("newDomain").value,
      DateDebut: $("newStart").value,
      DateEcheance: $("newEnd").value || $("newStart").value,
      Description: $("newDescription").value.trim(),
      Evenement: $("newEvent").checked
    };

    if ($("newStatus").value) logicalRecord.Statut = $("newStatus").value;
    if ($("newComment").value.trim()) logicalRecord.Commentaire = $("newComment").value.trim();

    if (!logicalRecord.Service || !logicalRecord.DateDebut || !logicalRecord.Description) {
      alert("Service, date de début et description sont obligatoires.");
      return;
    }

    try {
      const mappedBack = grist.mapColumnNamesBack(logicalRecord, {mappings:lastMappings});
      // `id` is reserved and cannot be created as a table column.
      if (mappedBack && Object.prototype.hasOwnProperty.call(mappedBack, "id")) {
        delete mappedBack.id;
      }
      await grist.selectedTable.create({fields:mappedBack}, {parseStrings:true});
      $("createBackdrop").style.display = "none";
    } catch (err) {
      console.error(err);
      alert(
        "Création impossible. Vérifie le niveau d’accès du widget et le mappage des colonnes.\n\n" +
        (err?.message || err)
      );
    }
  }

  function setNotice(message) {
    $("notice").textContent = message;
    $("notice").style.display = message ? "block" : "none";
  }

  document.addEventListener("DOMContentLoaded", () => {
    calendar = new FullCalendar.Calendar($("calendar"), {
      locale: "fr",
      initialView: "dayGridMonth",
      height: "100%",
      firstDay: 1,
      weekends: true,
      selectable: true,
      dayMaxEvents: 5,
      moreLinkClick: "popover",

      headerToolbar: {
        left: "prev,next today",
        center: "title",
        right: "dayGridMonth,timeGridWeek,timeGridDay"
      },

      buttonText: {
        today: "Aujourd’hui",
        month: "Mois",
        week: "Semaine",
        day: "Jour"
      },

      events: [],

      eventContent(info) {
        const p = info.event.extendedProps;
        return {
          html: `<div class="event-compact">
            <div class="event-main">${escapeHtml(p.assignee || "Non assigné")} · ${escapeHtml(p.service || "Sans service")}</div>
            <div class="event-description">${escapeHtml(p.description || "")}</div>
          </div>`
        };
      },

      eventMouseEnter(info) {
        showTooltip(info.event, info.jsEvent);
        info.el.addEventListener("mousemove", moveTooltip);
      },

      eventMouseLeave(info) {
        closeTooltip();
        info.el.removeEventListener("mousemove", moveTooltip);
      },

      eventClick(info) {
        info.jsEvent.preventDefault();
        openDetail(info.event);
      },

      select(info) {
        openCreate(info.start, info.end);
        calendar.unselect();
      },

      dateClick(info) {
        openCreate(info.date, null);
      }
    });

    calendar.render();

    $("filterService").addEventListener("change", refreshCalendar);
    $("filterAssignee").addEventListener("change", refreshCalendar);

    $("clearFilters").addEventListener("click", () => {
      $("filterService").value = "";
      $("filterAssignee").value = "";
      refreshCalendar();
    });

    $("createBtn").addEventListener("click", () => openCreate());
    $("closeDetail").addEventListener("click", () => $("detailBackdrop").style.display = "none");
    $("saveDetail").addEventListener("click", saveDetail);
    $("cancelCreate").addEventListener("click", () => $("createBackdrop").style.display = "none");
    $("saveCreate").addEventListener("click", createAction);

    $("detailBackdrop").addEventListener("click", e => {
      if (e.target === $("detailBackdrop")) {
        $("detailBackdrop").style.display = "none";
        currentDetailRowId = null;
      }
    });
    $("createBackdrop").addEventListener("click", e => {
      if (e.target === $("createBackdrop")) $("createBackdrop").style.display = "none";
    });
  });

  grist.ready({
    requiredAccess: "full",
    allowSelectBy: true,
    columns: REQUIRED_COLUMNS
  });

  // Chargement du référentiel Service indépendant de la présence d'actions.
  // Permet de créer la toute première action d'un service.
  loadReferenceServices().then(() => {
    rebuildFilters();
  });

  grist.onRecords((records, mappings) => {
    sourceRecords = records || [];
    lastMappings = mappings;

    const mapped = grist.mapColumnNames(sourceRecords, {mappings});
    if (!mapped) {
      mappedRecords = [];
      setNotice("Mappe les colonnes demandées dans le panneau du widget Grist.");
    } else {
      mappedRecords = mapped;
      setNotice("");
    }

    // Si le référentiel n'est pas encore chargé, on ne bloque pas l'affichage.
    if (!referenceServices.length) {
      referenceServices = uniqueValues("Service").map(label => ({id:null, label, fallback:true}));
    }

    rebuildFilters();
    refreshCalendar();
  }, {format:"rows", keepEncoded:false});
</script>
</body>
</html>
