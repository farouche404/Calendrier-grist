<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban BMEO</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    :root{
      --border:#e5e7eb; --muted:#667085; --text:#1f2937; --bg:#f7f8fa;
      --card:#ffffff; --navy:#334155; --soft:#f1f5f9;
      --shadow:0 6px 22px rgba(15,23,42,.08);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    .app{padding:14px;min-height:100vh}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:12px}
    select,input,textarea{width:100%;border:1px solid #d6dbe3;border-radius:9px;padding:10px 11px;font:inherit;background:#fff;color:var(--text)}
    .toolbar select{width:auto;min-width:180px}
    button{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}
    .btn-primary{background:var(--navy);color:#fff}.btn-secondary{background:#fff;border:1px solid var(--border);color:var(--text)}
    .spacer{flex:1}
    .board{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:14px}
    .column{flex:0 0 310px;background:#eef2f6;border:1px solid #e3e8ef;border-radius:14px;min-height:520px}
    .column.drag-over{outline:2px dashed #64748b;outline-offset:-5px}
    .column-header{display:flex;align-items:center;justify-content:space-between;padding:12px 13px 9px;font-weight:800;position:sticky;top:0;background:#eef2f6;z-index:2;border-radius:14px 14px 0 0}
    .count{min-width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--border);border-radius:999px;font-size:12px;color:var(--muted)}
    .cards{padding:4px 10px 12px;min-height:460px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin:9px 0;padding:11px 12px;box-shadow:0 2px 8px rgba(15,23,42,.05);cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
    .card:hover{transform:translateY(-1px);box-shadow:var(--shadow)} .card.dragging{opacity:.45}
    .service{font-size:12px;font-weight:800;color:#475569;margin-bottom:6px}
    .description{font-size:14px;font-weight:750;line-height:1.35;margin-bottom:10px}
    .meta{display:grid;grid-template-columns:1fr;gap:5px;font-size:12px;color:#596579}
    .meta-row{display:flex;gap:6px;align-items:flex-start}.meta-label{font-weight:750;color:#334155}
    .empty{color:#8a94a6;font-size:13px;padding:18px 8px;text-align:center}
    .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.42);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
    .modal-backdrop.open{display:flex}
    .modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 24px 80px rgba(15,23,42,.25);padding:18px}
    .modal h2{margin:0 0 14px;font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}
    label{font-size:12px;font-weight:800;color:#667085}textarea{min-height:110px;resize:vertical}
    .modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}
    .error{display:none;margin-top:10px;padding:9px 10px;border-radius:8px;background:#fff1f2;color:#be123c;font-size:13px}.error.show{display:block}
    @media (max-width:700px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.toolbar select{min-width:145px}}
  </style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <select id="serviceFilter"><option value="">Tous les services</option></select>
    <select id="actorFilter"><option value="">Tous les acteurs</option></select>
    <button id="resetFilters" class="btn-secondary">Réinitialiser les filtres</button>
    <div class="spacer"></div>
  </div>
  <div id="board" class="board"></div>
</div>

<div id="modalBackdrop" class="modal-backdrop">
  <div class="modal">
    <h2>Modifier l’action</h2>
    <div class="grid">
      <div class="field"><label>Service</label><select id="editService"></select></div>
      <div class="field"><label>Assigné</label><input id="editAssigne" type="text" /></div>
      <div class="field"><label>Domaine</label><select id="editDomaine"></select></div>
      <div class="field"><label>Statut</label><select id="editStatut"></select></div>
      <div class="field"><label>Date d’échéance</label><input id="editEcheance" type="date" /></div>
      <div class="field full"><label>Description</label><textarea id="editDescription"></textarea></div>
    </div>
    <div id="modalError" class="error"></div>
    <div class="modal-actions">
      <button id="cancelEdit" class="btn-secondary">Annuler</button>
      <button id="saveEdit" class="btn-primary">Enregistrer</button>
    </div>
  </div>
</div>

<script>
(() => {
  const REQUIRED_COLUMNS = [
    {name:"Service", title:"Service"},
    {name:"Assigne", title:"Assigné"},
    {name:"Description", title:"Description"},
    {name:"Domaine", title:"Domaine"},
    {name:"DateEcheance", title:"Date d’échéance"},
    {name:"Statut", title:"Statut"}
  ];
  let mappedRecords = [], lastMappings = null, currentRowId = null, currentDragId = null;
  const $ = id => document.getElementById(id);

  function displayValue(v){
    if (v == null) return "";
    if (Array.isArray(v)) return v.map(displayValue).filter(Boolean).join(", ");
    if (typeof v === "object") {
      if ("displayValue" in v) return displayValue(v.displayValue);
      if ("label" in v) return displayValue(v.label);
      if ("value" in v) return displayValue(v.value);
      return String(v);
    }
    return String(v);
  }
  function splitPeople(v){
    const s = displayValue(v).trim();
    return s ? s.split(/\s*[,;|]\s*/).map(x=>x.trim()).filter(Boolean) : [];
  }
  function normalizeDate(v){
    if (!v) return "";
    if (typeof v === "number") return new Date(v*1000).toISOString().slice(0,10);
    const s = displayValue(v).trim();
    const iso = s.match(/^(\d{4}-\d{2}-\d{2})/); if (iso) return iso[1];
    const fr = s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if (fr) return `${fr[3]}-${fr[2]}-${fr[1]}`;
    const d = new Date(s); return isNaN(d) ? "" : d.toISOString().slice(0,10);
  }
  function formatDate(v){
    const iso = normalizeDate(v); if (!iso) return "—";
    const [y,m,d] = iso.split("-"); return `${d}/${m}/${y}`;
  }
  function uniqueValues(field){
    const set = new Set();
    mappedRecords.forEach(r=>{
      if(field==="Assigne") splitPeople(r[field]).forEach(x=>set.add(x));
      else { const v=displayValue(r[field]).trim(); if(v) set.add(v); }
    });
    return [...set].sort((a,b)=>a.localeCompare(b,"fr",{sensitivity:"base"}));
  }
  function setOptions(select, values, firstLabel, selected){
    select.innerHTML="";
    if(firstLabel!=null){const o=document.createElement("option");o.value="";o.textContent=firstLabel;select.appendChild(o);}
    values.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;select.appendChild(o);});
    if(selected!=null) select.value=displayValue(selected);
  }
  function rebuildFilters(){
    setOptions($("serviceFilter"),uniqueValues("Service"),"Tous les services",$("serviceFilter").value);
    setOptions($("actorFilter"),uniqueValues("Assigne"),"Tous les acteurs",$("actorFilter").value);
  }
  function filteredRecords(){
    const service=$("serviceFilter").value, actor=$("actorFilter").value;
    return mappedRecords.filter(r=>(!service||displayValue(r.Service)===service)&&(!actor||splitPeople(r.Assigne).includes(actor)));
  }
  function statuses(){ return uniqueValues("Statut"); }
  function escapeHtml(s){ return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;"); }
  function cardHtml(r){
    return `<div class="service">${escapeHtml(displayValue(r.Service)||"Sans service")}</div>
      <div class="description">${escapeHtml(displayValue(r.Description)||"Sans description")}</div>
      <div class="meta">
        <div class="meta-row"><span class="meta-label">Assigné :</span><span>${escapeHtml(displayValue(r.Assigne)||"—")}</span></div>
        <div class="meta-row"><span class="meta-label">Domaine :</span><span>${escapeHtml(displayValue(r.Domaine)||"—")}</span></div>
        <div class="meta-row"><span class="meta-label">Échéance :</span><span>${escapeHtml(formatDate(r.DateEcheance))}</span></div>
      </div>`;
  }
  function renderBoard(){
    const board=$("board"); board.innerHTML="";
    const records=filteredRecords();
    const sts=statuses();
    sts.forEach(status=>{
      const col=document.createElement("section"); col.className="column"; col.dataset.status=status;
      const items=records.filter(r=>displayValue(r.Statut)===status);
      col.innerHTML=`<div class="column-header"><span>${escapeHtml(status)}</span><span class="count">${items.length}</span></div><div class="cards"></div>`;
      const cards=col.querySelector(".cards");
      if(!items.length){const e=document.createElement("div");e.className="empty";e.textContent="Aucune action";cards.appendChild(e);}
      items.forEach(r=>{
        const card=document.createElement("article"); card.className="card"; card.draggable=true; card.dataset.rowId=r.id; card.innerHTML=cardHtml(r);
        card.addEventListener("click",()=>openEdit(r.id));
        card.addEventListener("dragstart",e=>{currentDragId=Number(r.id);card.classList.add("dragging");e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",String(r.id));});
        card.addEventListener("dragend",()=>{currentDragId=null;card.classList.remove("dragging");document.querySelectorAll(".column").forEach(c=>c.classList.remove("drag-over"));});
        cards.appendChild(card);
      });
      col.addEventListener("dragover",e=>{e.preventDefault();col.classList.add("drag-over");e.dataTransfer.dropEffect="move";});
      col.addEventListener("dragleave",()=>col.classList.remove("drag-over"));
      col.addEventListener("drop",async e=>{e.preventDefault();col.classList.remove("drag-over");const id=Number(e.dataTransfer.getData("text/plain")||currentDragId);if(id) await moveCard(id,status);});
      board.appendChild(col);
    });
    if(!sts.length) board.innerHTML='<div class="empty">Aucun statut trouvé.</div>';
  }
  async function moveCard(rowId,newStatus){
    const rec=mappedRecords.find(r=>Number(r.id)===Number(rowId)); if(!rec||displayValue(rec.Statut)===newStatus) return;
    const fields=grist.mapColumnNamesBack({Statut:newStatus},{mappings:lastMappings});
    if(fields&&Object.prototype.hasOwnProperty.call(fields,"id")) delete fields.id;
    try{ await grist.selectedTable.update({id:Number(rowId),fields},{parseStrings:true}); }
    catch(err){ alert("Impossible de modifier le statut dans Grist : "+(err?.message||err)); }
  }
  function openEdit(rowId){
    const r=mappedRecords.find(x=>Number(x.id)===Number(rowId)); if(!r) return; currentRowId=Number(rowId);
    setOptions($("editService"),uniqueValues("Service"),null,displayValue(r.Service));
    $("editAssigne").value=displayValue(r.Assigne);
    setOptions($("editDomaine"),uniqueValues("Domaine"),null,displayValue(r.Domaine));
    setOptions($("editStatut"),statuses(),null,displayValue(r.Statut));
    $("editEcheance").value=normalizeDate(r.DateEcheance);
    $("editDescription").value=displayValue(r.Description);
    $("modalError").classList.remove("show"); $("modalBackdrop").classList.add("open");
  }
  function closeEdit(){ $("modalBackdrop").classList.remove("open"); currentRowId=null; }
  async function saveEdit(){
    if(!currentRowId) return;
    const logical={Service:$("editService").value,Assigne:$("editAssigne").value.trim(),Domaine:$("editDomaine").value,Statut:$("editStatut").value,DateEcheance:$("editEcheance").value,Description:$("editDescription").value.trim()};
    if(!logical.Service||!logical.Statut||!logical.Description){const e=$("modalError");e.textContent="Service, statut et description sont obligatoires.";e.classList.add("show");return;}
    const fields=grist.mapColumnNamesBack(logical,{mappings:lastMappings}); if(fields&&Object.prototype.hasOwnProperty.call(fields,"id")) delete fields.id;
    try{await grist.selectedTable.update({id:Number(currentRowId),fields},{parseStrings:true});closeEdit();}
    catch(err){const e=$("modalError");e.textContent="Impossible d’enregistrer dans Grist : "+(err?.message||err);e.classList.add("show");}
  }

  $("serviceFilter").addEventListener("change",renderBoard);
  $("actorFilter").addEventListener("change",renderBoard);
  $("resetFilters").addEventListener("click",()=>{$("serviceFilter").value="";$("actorFilter").value="";renderBoard();});
  $("cancelEdit").addEventListener("click",closeEdit);
  $("saveEdit").addEventListener("click",saveEdit);
  $("modalBackdrop").addEventListener("click",e=>{if(e.target===$("modalBackdrop"))closeEdit();});

  grist.ready({requiredAccess:"full",allowSelectBy:true,columns:REQUIRED_COLUMNS});
  grist.onRecords((records,mappings)=>{
    lastMappings=mappings||null;
    mappedRecords=grist.mapColumnNames(records||[],{mappings})||[];
    rebuildFilters(); renderBoard();
  },{format:"rows",keepEncoded:false});
})();
</script>
</body>
</html>
